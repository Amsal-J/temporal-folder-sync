services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # Temporal server
      - "8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    image: temporal-folder-sync:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./folder1:/app/folder1
      - ./folder2:/app/folder2
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  starter:
    build: .
    image: temporal-folder-sync:latest
    command: ["foldersync.FolderSyncStarter"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy